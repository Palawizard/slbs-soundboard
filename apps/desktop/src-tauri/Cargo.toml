[package]
name = "slbs-soundboard"
version = "0.3.0"
description = "Windows soundboard manager with a virtual microphone"
authors = ["SLB"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slbs_soundboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slb-audio-engine = { path = "../../../crates/audio-engine" }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "fs", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
keyring = { version = "4.1.5", features = ["v1"] }
rand = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }
